# Build e testes do backend em todo pull request e em todo envio para a main.
#
# Sobe um MySQL 8.4 de teste para o teste de contexto do Spring (que valida o esquema com o
# Flyway e o Hibernate). A chave JWT é gerada na hora: nenhum segredo real é usado aqui.
# O job se chama "ci": é esse nome que a regra da branch main exige.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: simasp_db
          MYSQL_USER: simasp_user
          MYSQL_PASSWORD: simasp_password
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/simasp_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      DB_USERNAME: simasp_user
      DB_PASSWORD: simasp_password
      IA_HABILITADA: "false"
      IA_DEMONSTRACAO: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Chave JWT de teste
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: Build e testes
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp verify
