spring.application.name=simasp

spring.config.import=optional:file:./.env[.properties]

# DATASOURCE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.id.new_generator_mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=simasp
security.jwt.expiration-seconds=3600

# JACKSON
# Campo novo na resposta do servico de IA nao pode quebrar o backend.
spring.jackson.deserialization.fail-on-unknown-properties=false

# SERVICO DE IA (ml-service)
ia.habilitada=${IA_HABILITADA:true}
ia.url=${IA_URL:http://localhost:5000}
ia.timeout=2s
ia.validade=30m
ia.idade-maxima-leitura=30m
ia.cache-regioes=10m
ia.tamanho-lote=100
ia.falhas-para-abrir=3
ia.pausa-apos-falhas=1m
ia.intervalo=PT10M
ia.atraso-inicial=PT30S
